name: tabungan_app
description: Dashboard tabungan neo-fintech minimalist
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  image_picker: ^1.0.7
  pdf: ^3.11.1            # <-- baru (untuk generate laporan PDF)
  printing: ^5.13.4       # <-- baru (untuk simpan/cetak PDF & download JSON)
  file_picker: ^8.1.4 
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4    # <-- baru (untuk pilih file JSON saat restore)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true